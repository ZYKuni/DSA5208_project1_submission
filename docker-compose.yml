name: dsa5208-mongodb-rs

services:
  mongo1:
    image: mongo:8.0.12
    hostname: mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo1_data:/data/db
      - ./config/init-replica-set.js:/opt/project/init-replica-set.js:ro
    networks:
      - mongo-rs-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --port 27017 --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  mongo2:
    image: mongo:8.0.12
    hostname: mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - mongo-rs-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --port 27017 --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  mongo3:
    image: mongo:8.0.12
    hostname: mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - mongo-rs-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --port 27017 --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  runner:
    image: dsa5208-experiment-runner:local
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    profiles: [experiments]
    working_dir: /workspace
    environment:
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
    volumes:
      - .:/workspace:ro
      - ./results:/workspace/results
    networks:
      - mongo-rs-network

networks:
  mongo-rs-network:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
