name: dsa5208-mw-fault

x-mongo: &mongo
  image: mongo:8.0.12
  command: [mongod, --replSet, rs0, --bind_ip_all, --port, '27017']
  restart: 'no'
  stop_grace_period: 30s
  healthcheck:
    test: [CMD-SHELL, "mongosh --quiet --host 127.0.0.1 --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"]
    interval: 2s
    timeout: 5s
    retries: 60

services:
  mongo1:
    <<: *mongo
    hostname: mongo1
    volumes:
      - mongo1_data:/data/db
      - ../config/init-replica-set.js:/opt/init.js:ro
    networks:
      replication: {}
      client1:
        aliases: [observe-mongo1]
  mongo2:
    <<: *mongo
    hostname: mongo2
    volumes: [mongo2_data:/data/db]
    networks:
      replication: {}
      client2:
        aliases: [observe-mongo2]
  mongo3:
    <<: *mongo
    hostname: mongo3
    volumes: [mongo3_data:/data/db]
    networks:
      replication: {}
      client3:
        aliases: [observe-mongo3]
  runner:
    image: dsa5208-experiment-runner:local
    profiles: [experiments]
    working_dir: /workspace
    environment:
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
    volumes:
      - ..:/workspace:ro
      - ../results:/workspace/results
    networks: [replication, client1, client2, client3]

networks:
  replication: {}
  client1: {}
  client2: {}
  client3: {}
volumes:
  mongo1_data: {}
  mongo2_data: {}
  mongo3_data: {}
